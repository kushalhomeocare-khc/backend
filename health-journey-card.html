<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Supporting Your Journey to Good Health | Kushal Online</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fjalla+One&family=Open+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
  }

  body {
    min-height: 100vh;
    background: #12CFFF;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 2px 24px;
    font-family: 'Open Sans', sans-serif;
  }

  .wrapper {
    width: 100%;
    max-width: 620px;
    text-align: center;
  }

  h1 {
    font-family: 'Fjalla One', sans-serif;
    font-weight: 400;
    text-transform: uppercase;
    color: #0a0a0a;
    font-size: clamp(26px, 5vw, 42px);
    line-height: 1.15;
    letter-spacing: 0.5px;
    margin-bottom: 16px;
  }

  .card {
    background: linear-gradient(160deg, rgba(214,242,255,0.55) 0%, rgba(150,215,255,0.45) 100%);
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
    border: 1px solid rgba(255,255,255,0.6);
    border-radius: 22px;
    padding: 40px 36px;
    text-align: left;
    box-shadow: 0 20px 40px rgba(0,60,110,0.18);
  }

  .icon {
    width: 64px;
    height: 64px;
    background: #ffffff;
    border-radius: 16px;
    display: flex;
    align-items: center;
    justify-content: center;
    float: left;
    shape-outside: margin-box;
    margin: 4px 20px 10px 0;
    box-shadow: 0 6px 14px rgba(0,60,110,0.2);
  }

  .icon svg {
    width: 32px;
    height: 32px;
  }

  p {
    font-size: clamp(18px, 3vw, 24px);
    font-weight: 500;
    color: #111;
    line-height: 1.5;
  }

  p::after {
    content: "";
    display: block;
    clear: both;
  }
</style>
</head>
<body>

  <div class="wrapper">
    <h1>Supporting Your Journey<br>to Good Health</h1>

    <div class="card">
      <div class="icon">
        <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M12 21s-7.5-4.7-10-9.3C.3 8.4 2 5 5.3 5c2 0 3.3 1.1 4 2.1.7-1 2-2.1 4-2.1 3.3 0 5 3.4 3.3 6.7C19.5 16.3 12 21 12 21z" fill="#12CFFF"/>
          <path d="M2 12h3l1.5-3L9 15l2-6 1.5 3H21" stroke="#ffffff" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </div>
      <p>We believe that effective healthcare begins with understanding the person behind the symptoms. Every patient deserves personalized homeopathic care delivered with compassion, professionalism, and integrity.</p>
    </div>
  </div>

</body>
</html>
