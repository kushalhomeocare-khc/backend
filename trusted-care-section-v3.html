<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Why Patients Choose Us — Brand Blue Mockup</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fjalla+One&family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#12cfff;
    --panel:#ffffff;
    --ink:#0b2430;
    --ink-soft:#2a3b42;
    --gold:#a9814f;
    --line:#dfe6e8;
  }
  *{box-sizing:border-box;}
  html, body{
    margin:0;
    min-height:100%;
    font-family:'Roboto',sans-serif;
    color:var(--ink);
  }
  .trusted-care-section{
    background:var(--bg);
  }
  .wrap{
    width:100%;
    max-width:1220px;
    margin:0 auto;
    padding:0 32px;
  }
  .panel{
    background:linear-gradient(180deg, rgba(255,255,255,0.7), rgba(205,238,251,0.45));
    backdrop-filter:blur(18px);
    -webkit-backdrop-filter:blur(18px);
    border:1px solid rgba(255,255,255,0.55);
    border-radius:28px;
    box-shadow:0 12px 24px -16px rgba(6,40,55,0.22), inset 0 1px 0 rgba(255,255,255,0.6);
    overflow:hidden;
  }
  .grid{
    display:grid;
    grid-template-columns:repeat(3,1fr);
  }
  .card{
    display:flex;
    gap:14px;
    align-items:flex-start;
    padding:28px 20px;
    border-left:1px solid rgba(255,255,255,0.55);
  }
  .card:first-child{ border-left:none; }
  .icon{
    flex:none;
    width:64px; height:64px;
    border-radius:14px;
    display:flex;
    align-items:center;
    justify-content:center;
    background:linear-gradient(135deg,#7cd8f7,#1f9fd6);
    box-shadow:0 8px 16px -6px rgba(31,159,214,0.55), inset 0 1px 0 rgba(255,255,255,0.4);
    color:#ffffff;
  }
  .icon svg{ width:30px; height:30px; }
  h3{
    font-family:'Fjalla One',sans-serif;
    font-weight:400;
    letter-spacing:0.02em;
    font-size:30px;
    line-height:1.1;
    margin:0 0 10px;
    color:#0b2430;
  }
  p{
    font-size:17.5px;
    line-height:1.45;
    color:var(--ink-soft);
    margin:0;
  }
  @media (max-width:760px){
    .grid{ grid-template-columns:1fr; }
    .card{ border-left:none; border-top:1px solid rgba(255,255,255,0.55); padding:20px 10px; gap:10px; }
    .card:first-child{ border-top:none; }
    .icon{ width:36px; height:36px; }
    .icon svg{ width:18px; height:18px; }
    .wrap{ padding:0 14px; }
    p{ font-size:16.5px; }
    h3{ font-size:20px; }
  }
</style>
</head>
<body>
<section class="trusted-care-section">
<div class="wrap">
  <div class="panel">
    <div class="grid">
      <div class="card">
        <div class="icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4">
            <circle cx="12" cy="8" r="6"/>
            <path d="M8.2 13.5 7 22l5-3 5 3-1.2-8.5"/>
          </svg>
        </div>
        <div>
          <h3>Experience</h3>
          <p>Over 25 years of clinical practice treating patients across India and abroad.</p>
        </div>
      </div>

      <div class="card">
        <div class="icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4">
            <rect x="6" y="3" width="12" height="18" rx="2"/>
            <path d="M9 3v2h6V3"/>
            <path d="M9 12l2 2 4-4"/>
          </svg>
        </div>
        <div>
          <h3>Expertise</h3>
          <p>Every prescription is based on a detailed evaluation of your individual case.</p>
        </div>
      </div>

      <div class="card">
        <div class="icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4">
            <path d="M12 3v18M5 7l-3 6a3.2 3.2 0 0 0 6 0l-3-6ZM19 7l-3 6a3.2 3.2 0 0 0 6 0l-3-6Z"/>
            <path d="M4 21h16M8 7h8"/>
          </svg>
        </div>
        <div>
          <h3>Ethics</h3>
          <p>Honest guidance with realistic expectations and patient-first recommendations.</p>
        </div>
      </div>
    </div>
  </div>
</div>
</section>
</body>
</html>
